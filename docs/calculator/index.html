<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Token Checkup</title>
<meta name="description" content="Answer six plain questions about your bots and see what they cost per week, which habits waste tokens, and what to tell your bots to fix it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F5F4; --sheet: #FFFFFF; --ink: #1B2430; --soft: #5C6773; --faint: #8A949E; --rule: #DCE2E5;
    --field: #E8EDEC; --leak: #D7385E; --leak-wash: #FBE7EC; --save: #0F8B8D; --save-wash: #E1F2F2;
    --amber: #E19A2C; --flow: #9AA6B1; --chip: #FFFFFF; --on: #1B2430; --on-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(27, 36, 48, .06), 0 12px 32px -12px rgba(27, 36, 48, .18);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0E1620; --sheet: #15202C; --ink: #E6ECEF; --soft: #A7B2BC; --faint: #7C8893; --rule: #263443;
      --field: #1D2A38; --leak: #F0587A; --leak-wash: #3A1A25; --save: #3CC1C3; --save-wash: #10302F;
      --flow: #5D6B78; --chip: #1A2633; --on: #E6ECEF; --on-ink: #0E1620; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15.5px/1.55 "Schibsted Grotesk", "Noto Sans TC", -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-feature-settings: "tnum" 1; }
  :lang(zh-Hant) body, html:lang(zh-Hant) { letter-spacing: .01em; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--save); outline-offset: 2px; border-radius: 6px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 0; }
  .mark { font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .mark svg { width: 22px; height: 22px; }
  .lang { display: inline-flex; background: var(--field); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--soft); }
  .lang button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .intro { padding: 34px 0 26px; max-width: 760px; }
  h1 { margin: 0; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 800; }
  :lang(zh-Hant) h1 { letter-spacing: -0.01em; line-height: 1.18; }
  .intro p { margin: 14px 0 0; font-size: 17px; color: var(--soft); max-width: 62ch; }

  .layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 36px; align-items: start; padding-bottom: 40px; }
  @media (max-width: 940px) { .layout { grid-template-columns: 1fr; gap: 24px; } }

  /* questions */
  .ask h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; }
  .ask h2 .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 12px; display: inline-grid; place-items: center; flex: none; }
  .ask section + section { margin-top: 28px; }
  .teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .team { border: 1.5px solid var(--rule); border-radius: 14px; padding: 12px 8px 10px; background: var(--chip); cursor: pointer; text-align: center;
    transition: border-color .2s var(--ease), transform .2s var(--ease); }
  .team:hover { border-color: var(--faint); }
  .team:active { transform: scale(.98); }
  .team svg { width: 100%; height: 40px; display: block; color: var(--soft); }
  .team span { display: block; font-size: 12.5px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
  .team[aria-pressed="true"] { border-color: var(--ink); background: var(--sheet); }
  .team[aria-pressed="true"] svg { color: var(--ink); }
  .q { padding: 14px 0; border-top: 1px solid var(--rule); }
  .q:first-child { border-top: 0; padding-top: 0; }
  .q .label { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
  .q .help { color: var(--faint); font-size: 13px; margin-top: 2px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .seg button { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--chip); cursor: pointer; font-size: 13.5px;
    transition: background-color .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease); }
  .seg button:hover { border-color: var(--faint); }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); border-color: var(--on); }
  select { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--chip); }

  /* the sheet */
  .sheet { background: var(--sheet); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 28px 24px; }
  @media (min-width: 941px) { .sheet { position: sticky; top: 18px; } }
  @media (max-width: 560px) { .sheet { padding: 20px 16px; border-radius: 18px; } }
  .bill { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center; }
  @media (max-width: 560px) { .row { grid-template-columns: 84px 1fr auto; gap: 10px; } }
  .row .who { color: var(--soft); font-size: 13.5px; }
  .track { height: 14px; border-radius: 7px; background: var(--field); overflow: hidden; }
  .fill { height: 100%; border-radius: 7px; transition: width .6s var(--ease); }
  .fill.now { background: var(--leak); } .fill.after { background: var(--save); }
  .amt { font-weight: 800; font-size: 26px; letter-spacing: -0.02em; text-align: right; min-width: 7ch; }
  .amt small { font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: 0; margin-left: 2px; }
  .amt.now { color: var(--leak); } .amt.after { color: var(--save); }
  .verdict { margin: 14px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .verdict .sub { display: block; font-size: 13.5px; font-weight: 400; color: var(--faint); letter-spacing: 0; margin-top: 2px; }

  .diagram-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 26px; }
  .diagram-head h3, .fixes h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .switch { display: inline-flex; background: var(--field); border-radius: 999px; padding: 3px; }
  .switch button { white-space: nowrap; border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--soft);
    transition: background-color .2s var(--ease), color .2s var(--ease); }
  .switch button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #diagram { width: 100%; height: auto; display: block; margin-top: 6px; }
  #diagram .node rect { transition: fill-opacity .5s var(--ease), stroke-opacity .5s var(--ease); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--faint); font-size: 12.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--flow); }
  .legend .dot.ack { background: var(--leak); }
  .legend .page { width: 10px; height: 12px; border: 1.5px solid var(--amber); border-radius: 2px; }

  .fixes { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 20px; }
  .fixes .lead { margin: 4px 0 6px; color: var(--faint); font-size: 13.5px; }
  .fix { padding: 14px 0; border-bottom: 1px solid var(--rule); transition: opacity .25s var(--ease); }
  .fix:last-child { border-bottom: 0; }
  .fix.off { opacity: .55; }
  .fix-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
  .toggle { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--rule); position: relative;
    cursor: pointer; margin: 0; transition: background-color .25s var(--ease); flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .25s var(--ease); }
  .toggle:checked { background: var(--save); }
  .toggle:checked::after { transform: translateX(16px); }
  .fix-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .fix-save { font-weight: 800; color: var(--save); white-space: nowrap; font-size: 15px; }
  .fix p { margin: 5px 0 0 50px; color: var(--soft); font-size: 14px; max-width: 62ch; }
  .fix details { margin: 8px 0 0 50px; }
  .fix summary { cursor: pointer; font-size: 13.5px; color: var(--save); font-weight: 600; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
  .fix summary::-webkit-details-marker { display: none; }
  .fix summary svg { width: 12px; height: 12px; transition: transform .2s var(--ease); }
  .fix details[open] summary svg { transform: rotate(90deg); }
  .say { margin-top: 8px; background: var(--field); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .say button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  @media (max-width: 560px) { .fix p, .fix details { margin-left: 0; } }
  .clean { margin-top: 10px; padding: 14px 16px; border-radius: 12px; background: var(--save-wash); }
  .fine { color: var(--faint); font-size: 12.5px; margin: 16px 0 0; }
  .fine a, footer a { color: var(--save); }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; background: var(--field); padding: 1px 5px; border-radius: 5px; }

  /* formulas */
  .expert { border-top: 1px solid var(--rule); padding: 8px 0 30px; }
  .expert > summary { cursor: pointer; font-weight: 700; padding: 14px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
  .expert > summary::-webkit-details-marker { display: none; }
  .expert > summary svg { width: 14px; height: 14px; transition: transform .2s var(--ease); }
  .expert[open] > summary svg { transform: rotate(90deg); }
  .expert .lead { color: var(--faint); font-size: 13.5px; margin: -6px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 28px; }
  .formula h4 { margin: 0 0 10px; font-size: 14.5px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .fields label { display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; font-size: 12px; color: var(--faint); }
  .fields input, .fields select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--chip); font-size: 14px; }
  .out { margin-top: 10px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .out small { display: block; font-size: 12.5px; font-weight: 400; color: var(--faint); letter-spacing: 0; }
  footer { color: var(--faint); font-size: 13px; padding: 0 0 36px; }

  .peek { display: none; }
  @media (max-width: 940px) {
    .peek { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 5; gap: 10px; align-items: center; justify-content: space-between;
      background: var(--ink); color: var(--paper); border: 0; border-radius: 16px; padding: 12px 16px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.45);
      transition: transform .3s var(--ease), opacity .3s var(--ease); cursor: pointer; text-align: left; }
    .peek.hide { transform: translateY(140%); opacity: 0; pointer-events: none; }
    .peek b { font-size: 17px; } .peek .now { color: #FF8BA4; } .peek .after { color: #6FE0E2; }
    .peek span { font-size: 13px; opacity: .8; }
    footer { padding-bottom: 90px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="mark" href="https://github.com/EndeavorYen/bot-token-optimizer">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="12" r="1.8" fill="currentColor"/><circle cx="15.5" cy="12" r="1.8" fill="currentColor"/></svg>
      bot-token-optimizer
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" type="button">EN</button><button id="lang-zh" type="button">中文</button>
    </div>
  </nav>

  <header class="intro">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <main class="layout">
    <div class="ask">
      <section>
        <h2><span class="n">1</span><span data-i18n="s1"></span></h2>
        <div class="teams" id="teams"></div>
      </section>
      <section>
        <h2><span class="n">2</span><span data-i18n="s2"></span></h2>
        <div id="questions"></div>
      </section>
      <section>
        <h2><span class="n">3</span><span data-i18n="s3"></span></h2>
        <select id="model" aria-label="Model"></select>
      </section>
    </div>

    <div class="sheet" aria-live="polite">
      <div class="bill">
        <div class="row"><span class="who" data-i18n="now"></span><div class="track"><div class="fill now" id="bar-now" style="width:100%"></div></div><div class="amt now" id="now"></div></div>
        <div class="row"><span class="who" data-i18n="after"></span><div class="track"><div class="fill after" id="bar-after" style="width:20%"></div></div><div class="amt after" id="after"></div></div>
      </div>
      <p class="verdict" id="verdict"></p>

      <div class="diagram-head">
        <h3 data-i18n="diagram"></h3>
        <div class="switch" role="group">
          <button id="view-now" type="button" data-i18n="viewNow"></button><button id="view-after" type="button" data-i18n="viewAfter"></button>
        </div>
      </div>
      <svg id="diagram" viewBox="0 0 640 320" role="img"></svg>
      <div class="legend">
        <span><i class="dot"></i><span data-i18n="lgWork"></span></span>
        <span><i class="dot ack"></i><span data-i18n="lgAck"></span></span>
        <span><i class="page"></i><span data-i18n="lgBoard"></span></span>
        <span data-i18n="lgHot"></span>
      </div>

      <div class="fixes">
        <h3 data-i18n="fixTitle"></h3>
        <p class="lead" data-i18n="fixLead"></p>
        <div id="fixes"></div>
        <p class="fine" id="fine"></p>
      </div>
    </div>
  </main>

  <details class="expert">
    <summary><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="expert"></span></summary>
    <p class="lead" data-i18n="expertLead"></p>
    <div class="grid">
      <div class="formula">
        <h4 data-i18n="b.title"></h4>
        <div class="fields">
          <label><span data-i18n="b.k"></span><input type="number" id="b-k" value="1" min="0" max="20" step="1"></label>
          <label><span data-i18n="b.mode"></span><select id="b-mode"><option value="sequential" data-i18n="b.seq"></option><option value="parallel" data-i18n="b.par"></option></select></label>
        </div>
        <div class="out" id="b-out"></div>
      </div>
      <div class="formula">
        <h4 data-i18n="l.title"></h4>
        <div class="fields">
          <label><span data-i18n="l.cw"></span><input type="number" id="l-cw" value="30000" min="0" step="1000"></label>
          <label><span data-i18n="l.cl"></span><input type="number" id="l-cl" value="60000" min="0" step="1000"></label>
          <label><span data-i18n="l.cc"></span><input type="number" id="l-cc" value="100000" min="0" step="1000"></label>
          <label><span data-i18n="l.n"></span><input type="number" id="l-n" value="6" min="1" max="50" step="1"></label>
        </div>
        <div class="out" id="l-out"></div>
      </div>
      <div class="formula">
        <h4 data-i18n="s.title"></h4>
        <div class="fields">
          <label><span data-i18n="s.n"></span><input type="number" id="s-n" value="12" min="2" max="500" step="1"></label>
          <label><span data-i18n="s.c0"></span><input type="number" id="s-c0" value="30000" min="0" step="1000"></label>
          <label><span data-i18n="s.m"></span><input type="number" id="s-m" value="1000" min="10" step="100"></label>
          <label><span data-i18n="s.cap"></span><input type="number" id="s-cap" value="6" min="2" max="100" step="1"></label>
        </div>
        <div class="out" id="s-out"></div>
      </div>
      <div class="formula">
        <h4 data-i18n="r.title"></h4>
        <div class="fields">
          <label><span data-i18n="r.c"></span><input type="number" id="r-c" value="150000" min="0" step="5000"></label>
          <label><span data-i18n="r.base"></span><input type="number" id="r-base" value="8000" min="0" step="1000"></label>
          <label><span data-i18n="r.wakes"></span><input type="number" id="r-wakes" value="10" min="0" step="1"></label>
          <label><span data-i18n="r.days"></span><input type="number" id="r-days" value="7" min="1" step="1"></label>
        </div>
        <div class="out" id="r-out"></div>
      </div>
    </div>
  </details>

  <footer><p id="foot"></p></footer>
  <button type="button" class="peek" id="peek"><span id="peek-label"></span><span><b class="now" id="peek-now"></b> <span>›</span> <b class="after" id="peek-after"></b></span></button>
</div>

<script type="module">
import * as calc from "./calc.js";
import * as team from "./team.js";
import { PRESETS } from "./presets.js";

const T = {
  en: {
    title: "Where does your bot bill go?",
    subtitle: "Pick the team that looks like yours and answer six questions about how your bots work. You'll see what they cost each week, which habits leak tokens, and exactly what to tell your bots.",
    s1: "Which team looks like yours?", s2: "How do your bots work today?", s3: "Which model do they run on?",
    teams: { pipeline: "Research, write, review", manager: "A manager and three workers", support: "Support desks and an expert" },
    q: {
      busy: ["How busy is the team?", "How often work passes from one bot to the next.", { quiet: "Quiet", normal: "Normal", busy: "Busy" }],
      age: ["When did your bots last start a fresh chat?", "A bot re-reads its whole chat every time it wakes up.", { fresh: "Today", days: "A few days ago", weeks: "About two weeks ago", month: "A month or more" }],
      acks: ["Do bots reply “OK” or “got it” to each other?", "", { never: "Never", sometimes: "Sometimes", usually: "Usually" }],
      board: ["When a bot is pinged, does it go read a board first?", "Instead of getting the content in the message.", { no: "No", yes: "Yes" }],
      group: ["Do bots post updates in a group chat?", "", { none: "No", short: "One-liners", long: "Long updates" }],
      relay: ["Is there a bot that mostly passes work along?", "A coordinator that forwards messages and does little else.", { no: "No", yes: "Yes" }],
    },
    now: "Today", after: "With your fixes", week: "/wk",
    verdict: (usd, pct) => `You could save about $${usd} a week, ${pct}% of the bill.`,
    verdictSub: (m) => `That's roughly $${m} a month.`,
    noFix: "Switch on a fix below to see what it saves.",
    clean: "Nothing obvious to fix here: no “OK” replies, no board round-trips, no relay, and fresh chats.",
    diagram: "Your team, and every message it sends", viewNow: "Today", viewAfter: "With fixes",
    lgWork: "hand-off", lgAck: "“OK” reply", lgBoard: "reads a board first", lgHot: "Deeper red costs more",
    perWeek: (usd) => `$${usd} a week`, forwards: "only forwards", groupLong: "Group chat with long updates", groupShort: "Group chat with one-liners",
    fixTitle: "What to change", fixLead: "Biggest saving first. Each figure is what that change saves on its own; the bill above adds up the ones you switch on.",
    alone: (usd) => `−$${usd}/wk`, say: "What to tell your bots", copy: "Copy", copied: "Copied",
    fix: {
      fresh: ["Hand over to a fresh chat regularly", "Your bots' history keeps growing, and every wake-up re-reads all of it. Starting fresh at about 60K tokens keeps each wake-up cheap.",
              "When our conversation gets long, or every few days, write a short hand-over summary: the goal, decisions made, open items, and where the key files are. Then tell me so I can start a fresh chat with it."],
      board: ["Put the content in the message, not on a board", "A ping makes the receiver re-read its whole history, and fetching the board makes it read again.",
              "When you hand work to another bot, put the content in the message itself. If it's too long, save it to a file and say exactly which section the other bot needs."],
      acks: ["Stop the “OK” and “got it” replies", "A two-word reply still wakes the other bot, which re-reads its whole history just to see it.",
             "Don't send acknowledgements like “OK”, “got it” or “thanks” to other bots. Only message another bot when it needs to do something, and combine updates into one message."],
      relay: ["Let bots hand off directly", "A bot that only forwards messages adds two wake-ups to every task.",
              "Send work directly to the bot that will do it, and report results directly to whoever asked. Don't route messages through a coordinator."],
      group: ["Keep the group chat to one-liners", "Every group message lands in every member's history, so a long update is paid for many times.",

// ------------------------------------------------------------ number tween (answers a person's change)
const shown = new Map();
function tween(el, to, fmt) {
  const from = shown.get(el) ?? to;
  shown.set(el, to);
  if (reduceMotion || from === to) { el.innerHTML = fmt(to); return; }
  const t0 = performance.now(), dur = 500;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmt(from + (to - from) * e);
    if (k < 1 && shown.get(el) === to) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  const t = L();
  $("teams").innerHTML = Object.keys(TEAM_ICONS).map((k) =>

     <div class="seg" role="group" aria-labelledby="q-${key}">${Object.entries(opts).map(([v, txt]) =>
       `<button type="button" data-q="${key}" data-v="${v}" aria-pressed="false">${esc(txt)}</button>`).join("")}</div></div>`).join("");
  $("model").innerHTML = Object.keys(PRESETS).map((k) => `<option value="${k}">${esc(MODEL_LABELS[k] || PRESETS[k].label)}</option>`).join("");

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-team], [data-q], #view-now, #view-after, .say button, #lang-en, #lang-zh");
  if (!el) return;
  if (el.dataset.team) { answers.team = el.dataset.team; chosen = null; }
  else if (el.dataset.q) { answers[el.dataset.q] = el.dataset.v; chosen = null; }
  else if (el.id === "view-now" || el.id === "view-after") view = el.id === "view-now" ? "now" : "after";
  else if (el.id === "lang-en" || el.id === "lang-zh") { lang = el.id === "lang-en" ? "en" : "zh-TW"; store.set("bto-lang", lang); buildControls(); }
  else {
    const text = el.closest(".say").querySelector("span").textContent;
    navigator.clipboard?.writeText(text).then(() => { el.textContent = L().copied; setTimeout(() => (el.textContent = L().copy), 1400); });
    return;
  }
  render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "model") { answers.model = e.target.value; render(); }

    chosen = new Set([...document.querySelectorAll("[data-fix]")].filter((x) => x.checked).map((x) => x.dataset.fix));

});

// ------------------------------------------------------------ the living team diagram
function diagram(res, org) {
  const t = L();
  const W = 640, H = 320, cx = 320, cy = 168, rx = 222, ry = 104, bw = 138, bh = 52;
  const names = org.bots.map((b) => b.name);
  const fixed = {
    manager: { chief: [320, 50], coordinator: [320, 164], "worker-1": [120, 276], "worker-2": [320, 276], "worker-3": [520, 276] },
    support: { "desk-1": [110, 70], "desk-2": [110, 266], coordinator: [330, 168], expert: [540, 168] },
  }[answers.team];
  const pos = {};
  names.forEach((n, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / names.length;
    pos[n] = fixed?.[n] || [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  });
  const cost = Object.fromEntries(res.bots.map((r) => [r.bot, r.cost_usd]));
  const maxCost = Math.max(...Object.values(cost), 1e-9);

  // one lane per (direction, kind) so hand-offs and "OK" replies never overlap
  const lanes = new Map();
  for (const l of org.links) {
    const ack = l.avg_tokens <= 30;
    const key = `${l.from}>${l.to}>${ack}`;
    const cur = lanes.get(key);
    lanes.set(key, { from: l.from, to: l.to, ack, n: (cur?.n || 0) + l.messages_per_day });
  }
  let paths = "", dots = "", i = 0;
  for (const ln of lanes.values()) {
    const [x1, y1] = pos[ln.from], [x2, y2] = pos[ln.to];
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const side = ln.from < ln.to ? 1 : -1;
    const off = side * (ln.ack ? 13 : 5);
    const nx = -uy * off, ny = ux * off;
    const s = Math.min(Math.abs((bw / 2 + 8) / (ux || 1e-9)), Math.abs((bh / 2 + 8) / (uy || 1e-9)));
    const ax = x1 + ux * s + nx, ay = y1 + uy * s + ny, bx = x2 - ux * s + nx, by = y2 - uy * s + ny;
    const d = `M${ax.toFixed(1)} ${ay.toFixed(1)} L${bx.toFixed(1)} ${by.toFixed(1)}`;
    const color = ln.ack ? "var(--leak)" : "var(--flow)";
    paths += `<path id="lane${i}" d="${d}" stroke="${color}" stroke-width="${ln.ack ? 1.4 : 1.8}" stroke-opacity="${ln.ack ? .55 : .7}" fill="none"
      ${ln.ack ? 'stroke-dasharray="3 4"' : ""} marker-end="url(#${ln.ack ? "tip-ack" : "tip"})"/>`;
    if (!reduceMotion) {
      const count = Math.max(1, Math.min(4, Math.round(ln.n / 3)));
      const dur = Math.max(1.4, Math.min(4.5, 9 / Math.sqrt(ln.n + 1)));
      for (let k = 0; k < count; k++) {
        dots += `<circle r="${ln.ack ? 2.6 : 3.4}" fill="${color}"><animateMotion dur="${dur.toFixed(2)}s" repeatCount="indefinite"
          begin="${(-dur * k / count).toFixed(2)}s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#lane${i}"/></animateMotion></circle>`;
      }
    }
    i++;
  }
  let nodes = "";
  for (const b of org.bots) {
    const [x, y] = pos[b.name];
    const share = cost[b.name] / maxCost;
    const relay = b.name === "coordinator";
    nodes += `<g class="node">
      <rect x="${x - bw / 2}" y="${y - bh / 2}" width="${bw}" height="${bh}" rx="14" fill="var(--leak)" fill-opacity="${(0.05 + 0.34 * share * share).toFixed(2)}"
        stroke="${relay ? "var(--amber)" : "var(--leak)"}" stroke-opacity="${relay ? 1 : (0.25 + 0.75 * share).toFixed(2)}" stroke-width="${relay ? 2 : 1.4}" ${relay ? 'stroke-dasharray="5 4"' : ""}/>
      <text x="${x}" y="${y - 5}" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink)">${esc(b.name)}</text>
      <text x="${x}" y="${y + 14}" text-anchor="middle" font-size="12" fill="var(--soft)">${esc(t.perWeek(money(cost[b.name])))}</text>
      ${relay ? `<text ${{
        support: `x="${x}" y="${y + bh / 2 + 18}" text-anchor="middle"`,
        manager: `x="${x + bw / 2 + 10}" y="${y + 4}"`,
      }[answers.team] || `x="${x - bw / 2 + 2}" y="${y - bh / 2 - 8}"`} font-size="12" font-weight="600" fill="var(--amber)">${esc(t.forwards)}</text>` : ""}
      ${b.reads_board_via_tool ? `<g transform="translate(${x + bw / 2 - 16} ${y - bh / 2 - 7})"><title>${esc(t.lgBoard)}</title>
        <rect width="13" height="16" rx="2.5" fill="var(--sheet)" stroke="var(--amber)" stroke-width="1.6"/><path d="M3.5 5h6M3.5 8h6M3.5 11h4" stroke="var(--amber)" stroke-width="1.3"/></g>` : ""}
    </g>`;
  }
  const g = org.groups[0];
  const group = g ? `<rect x="10" y="12" width="${W - 20}" height="${H - 20}" rx="26" fill="var(--field)" fill-opacity=".55"/>
    <text x="30" y="38" font-size="12.5" fill="var(--faint)">${esc(g.avg_tokens > 200 ? t.groupLong : t.groupShort)}</text>` : "";
  $("diagram").setAttribute("aria-label", t.diagram);
  $("diagram").innerHTML = `<defs>
      <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--flow)" stroke-width="1.8"/></marker>
      <marker id="tip-ack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--leak)" stroke-width="1.8"/></marker>
    </defs>${group}${paths}${dots}${nodes}`;
}

function render() {
  const t = L();
  document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : "en";
  document.title = lang === "zh-TW" ? "Bot Token 健檢" : "Bot Token Checkup";
  document.querySelectorAll("[data-i18n]").forEach((el) => { const v = t[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
  $("lang-en").setAttribute("aria-pressed", lang === "en");
  $("lang-zh").setAttribute("aria-pressed", lang === "zh-TW");
  document.querySelectorAll("[data-team]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.team === answers.team));
  document.querySelectorAll("[data-q]").forEach((b) => b.setAttribute("aria-pressed", answers[b.dataset.q] === b.dataset.v));

  const pricing = PRESETS[answers.model];
  const applicable = team.applicableFixes(answers);
  const picked = chosen ? new Set([...chosen].filter((f) => applicable.includes(f))) : new Set(applicable);
  const r = team.analyze(answers, picked, pricing);

  const fmtAmt = (x) => `$${money(x)}<small>${t.week}</small>`;
  tween($("now"), r.now.totalUsd, fmtAmt);
  tween($("after"), r.after.totalUsd, fmtAmt);
  $("bar-after").style.width = `${Math.max(1.5, (100 * r.after.totalUsd) / Math.max(r.now.totalUsd, 1e-9))}%`;
  const saved = r.now.totalUsd - r.after.totalUsd;
  $("verdict").innerHTML = saved > 0.005
    ? `${esc(t.verdict(money(saved), Math.round((100 * saved) / r.now.totalUsd)))}<span class="sub">${esc(t.verdictSub(money(saved * 30 / 7)))}</span>`
    : esc(applicable.length ? t.noFix : t.clean);

  $("view-now").setAttribute("aria-pressed", view === "now");
  $("view-after").setAttribute("aria-pressed", view === "after");
  const s = view === "now" ? r.now : r.after;
  diagram(s.res, s.org);

  const order = [...applicable].sort((a, b) => r.alone[b] - r.alone[a]);
  $("fixes").innerHTML = order.length ? order.map((f) => {
    const [title, why, say] = t.fix[f];
    const on = picked.has(f);
    return `<div class="fix ${on ? "" : "off"}">
      <label class="fix-head"><input class="toggle" type="checkbox" data-fix="${f}" ${on ? "checked" : ""}>
        <span class="fix-title">${esc(title)}</span><span class="fix-save">${t.alone(money(r.alone[f]))}</span></label>
      <p>${esc(why)}</p>
      <details><summary>${CHEVRON}${esc(t.say)}</summary><div class="say"><span>${esc(say)}</span><button type="button">${esc(t.copy)}</button></div></details>
    </div>`;
  }).join("") : `<div class="clean">${esc(t.clean)}</div>`;
  $("peek-label").textContent = t.peek;
  $("peek-now").textContent = `$${money(r.now.totalUsd)}`;
  $("peek-after").textContent = `$${money(r.after.totalUsd)}${t.week}`;
  $("fine").innerHTML = t.fine(pricing.checked || "");
  $("foot").innerHTML = t.foot;
  renderExpert(pricing);
}

// ------------------------------------------------------------ formulas
const num = (id) => Math.max(0, parseFloat($(id).value) || 0);
function renderExpert(p) {
  const t = L();
  const b = calc.boardOverhead(Math.round(num("b-k")), $("b-mode").value, calc.priceRatios(p).cache);
  $("b-out").innerHTML = t["b.out"](b.token_ratio, b.receiver_cost_ratio_cold_cache);
  const n = Math.max(1, Math.round(num("l-n")));
  $("l-out").innerHTML = t["l.out"](calc.scenarioRelay(num("l-cw"), num("l-cl"), num("l-cc")).ratio,
                                     calc.scenarioAggregate(n, num("l-cw"), num("l-cl"), num("l-cc")).ratio);
  const sp = calc.optimalSpan(Math.max(2, Math.round(num("s-n"))), num("s-c0"), Math.max(num("s-m"), 1), null, Math.max(2, Math.round(num("s-cap"))), true);
  $("s-out").innerHTML = t["s.out"](sp.best.k, sp.closed_form_k, sp.best);
  const rd = calc.resetDecision(num("r-c"), num("r-base"), p, { wakesPerDay: num("r-wakes"), horizonDays: num("r-days") });
  $("r-out").innerHTML = t["r.out"](rd.breakeven_wakes, rd.net_saving_usd);
}
document.querySelectorAll(".expert input, .expert select").forEach((el) => el.addEventListener("input", () => renderExpert(PRESETS[answers.model])));

$("peek").addEventListener("click", () => document.querySelector(".sheet").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }));
new IntersectionObserver(([e]) => $("peek").classList.toggle("hide", e.isIntersecting), { threshold: 0.15 }).observe(document.querySelector(".sheet"));

buildControls();
render();
</script>
</body>
